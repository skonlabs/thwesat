<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="ThweSat">
  <defs>
    <!-- Mask to carve concave inner corner on the top crossbar -->
    <mask id="m">
      <rect width="96" height="96" fill="white"/>
      <path d="M66,34 Q66,46 50,46 L66,46 Z" fill="black"/>
    </mask>
  </defs>
  <!-- F letterform -->
  <g mask="url(#m)">
    <rect x="9"  y="9"  width="21" height="78" fill="#1A2B45"/>
    <rect x="30" y="9"  width="36" height="25" fill="#1A2B45"/>
    <rect x="30" y="46" width="28" height="16" fill="#1A2B45"/>
  </g>
  <!-- Teal triangle — diagonal cut at top-right of top crossbar -->
  <polygon points="49,9 66,9 66,34" fill="#29C5BE"/>
  <!-- Teal rectangle — right of middle bar -->
  <rect x="62" y="48" width="14" height="13" fill="#29C5BE"/>
</svg>